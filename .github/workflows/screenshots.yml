name: Screenshots

# Run manually (Actions → Screenshots → Run workflow) to refresh docs/screenshots from the
# Robolectric screenshot tests. Commits back to the branch it ran on.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Record screenshots
        working-directory: android
        run: ./gradlew --no-daemon --no-build-cache recordRoborazziDebug
      - name: Shrink and commit
        run: |
          pip install --quiet pillow
          mkdir -p docs/screenshots
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          for src in sorted(Path("android/app/screenshots").glob("*.png")):
              im = Image.open(src).convert("RGB")
              w = 540
              im = im.resize((w, round(im.height * w / im.width)), Image.LANCZOS)
              im.save(Path("docs/screenshots") / (src.stem + ".jpg"), quality=85, optimize=True)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update app screenshots [skip ci]"
          git push
