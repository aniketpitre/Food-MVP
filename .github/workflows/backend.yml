name: Backend

on:
  push:
    branches: ["**"]
    paths: ["backend/**", "docker-compose.yml", ".github/workflows/backend.yml", "scripts/smoke-test.sh"]
  pull_request:
    paths: ["backend/**", "docker-compose.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5433/postgres

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: |
          cat > .env <<ENV
          POSTGRES_PASSWORD=ci-$(openssl rand -hex 8)
          JWT_SECRET=$(openssl rand -hex 32)
          DEMO_ACTIVITY=true
          ENV
          docker compose up -d --build --wait
      - name: Smoke test
        run: scripts/smoke-test.sh http://localhost:8080
      - name: Logs on failure
        if: failure()
        run: docker compose logs
