name: Device smoke test

# Installs the minified release build on an Android emulator and lets the monkey tester tap
# through it, so a shrinking (R8) or native-library problem shows up before a release.
on:
  workflow_dispatch:
  push:
    branches: ["main", "claude/**"]
    paths: ["android/**", ".github/workflows/device-smoke.yml", "scripts/device-smoke.sh"]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build the release APK (R8 on)
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease
      - name: Run it on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/device-smoke.sh android/app/build/outputs/apk/release/app-release.apk
      - name: Keep the monkey log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monkey-log
          path: monkey.log
          if-no-files-found: ignore
