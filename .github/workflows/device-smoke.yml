name: Device smoke test

# Installs the minified release build on an Android emulator and lets the monkey tester tap
# through it, so a shrinking (R8) or native-library problem shows up before a release.
on:
  workflow_dispatch:
  push:
    branches: ["main", "claude/**"]
    paths: ["android/**", "backend/**", ".github/workflows/device-smoke.yml", "scripts/device-*.sh"]

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build the release APK (R8 on)
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease
      - name: Run it on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/device-smoke.sh android/app/build/outputs/apk/release/app-release.apk
      - name: Keep the monkey log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monkey-log
          path: monkey.log
          if-no-files-found: ignore

  # The real app on an emulator against a real server: the map, its food logos, the 3D place
  # card and Take me there, plus stories and messages. Screenshots go to docs/device.
  journey:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Start a FoodFeed server with demo data
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 16)/" .env
          sed -i "s/^JWT_SECRET=.*/JWT_SECRET=$(openssl rand -hex 32)/" .env
          sed -i "s/^DEMO_ACTIVITY=.*/DEMO_ACTIVITY=true/" .env
          docker compose up -d --build db api
          for i in $(seq 1 90); do curl -fs localhost:8080/health && break; sleep 2; done
          curl -fs localhost:8080/health
          # Real places around Nashik from OpenStreetMap, so the map shows quiet logos too.
          timeout 180 docker compose exec -T api node dist/cli.js import-places nashik 4 || echo "OpenStreetMap import skipped"
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build the app and its device test (pointed at the emulator's host)
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest -PserverUrl=http://10.0.2.2:8080
      - name: Run the journey on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: false
          profile: pixel_6
          script: bash scripts/device-journey.sh android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
      - name: Keep logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-journey
          path: |
            journey.log
            logcat.txt
            device-shots/
          if-no-files-found: ignore
      - name: Commit the screenshots
        if: always() && github.event_name != 'pull_request'
        run: |
          shopt -s nullglob
          mkdir -p docs/device
          for f in device-shots/*.png; do
            # Smaller JPEGs for the repo.
            convert "$f" -resize 540x -quality 82 "docs/device/$(basename "${f%.png}").jpg"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/device
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update device journey screenshots [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push
