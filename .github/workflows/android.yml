name: Android

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_version:
        description: "Publish a GitHub release with this version, e.g. 0.1.0 (leave empty to only build)"
        required: false
        default: ""
      release_notes:
        description: "What's new, shown in the app's update prompt. Separate points with ; (e.g. Comments on posts; Location everywhere in India)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          if [[ -n "$RELEASE_VERSION" ]]; then
            if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::release_version must look like 1.2.3"; exit 1
            fi
            echo "name=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.1.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Release notes
        id: notes
        env:
          NOTES: ${{ inputs.release_notes }}
        run: |
          {
            echo "text<<NOTES_EOF"
            if [[ -n "$NOTES" ]]; then
              echo "### What's new"
              echo "$NOTES" | tr ';' '\n' | sed 's/^ *//; s/ *$//' | grep -v '^$' | sed 's/^/- /'
              echo
            fi
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Unit tests and screenshot tests
        run: ./gradlew --no-daemon testDebugUnitTest recordRoborazziDebug

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: android/app/screenshots/
          if-no-files-found: ignore

      - name: Release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          IS_RELEASE: ${{ steps.version.outputs.release }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks"
              echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
              echo "SIGNED_WITH_RELEASE_KEY=true"
            } >> "$GITHUB_ENV"
            echo "Signing with the private release key."
          elif [[ "$IS_RELEASE" == "true" ]]; then
            echo "::error::Releases must be signed with the private key. Add the ANDROID_KEYSTORE_* secrets (see README)."
            exit 1
          else
            echo "::notice::No release key secrets; this build is signed with the public pilot test key."
          fi

      - name: Build release APK
        env:
          # Optional repository variable to override serverUrl from android/gradle.properties.
          FOODFEED_SERVER_URL: ${{ vars.FOODFEED_SERVER_URL }}
        run: |
          ./gradlew --no-daemon assembleRelease \
            -PversionName=${{ steps.version.outputs.name }} -PversionCode=${{ github.run_number }}
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/WorthAbite-${{ steps.version.outputs.name }}.apk"

      - name: Verify the APK signature
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs dist/*.apk | tee signer.txt
          actual=$(grep -m1 'SHA-256 digest' signer.txt | awk '{print $NF}' | tr 'a-f' 'A-F')
          expected=$(grep -v '^#' keystore/RELEASE_KEY_FINGERPRINT.txt | tr -d ':[:space:]')
          if [[ "$SIGNED_WITH_RELEASE_KEY" == "true" ]]; then
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::APK is signed with $actual but the registered release key is $expected"
              exit 1
            fi
            echo "Signed with the registered release key ($expected)."
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WorthAbite-apk
          path: android/dist/*.apk

      - name: Publish GitHub release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: WorthAbite ${{ steps.version.outputs.name }}
          files: android/dist/*.apk
          generate_release_notes: true
          body: |
            ${{ steps.notes.outputs.text }}
            **WorthAbite pilot build ${{ steps.version.outputs.name }}** (Android 8.0+)

            1. Download `WorthAbite-${{ steps.version.outputs.name }}.apk` below on your phone.
            2. Open it and allow "Install unknown apps" for your browser or file manager when asked.
            3. Open WorthAbite and pick your city. The app connects to the WorthAbite server built into it; no setup needed.

            Signed with the WorthAbite release key (SHA-256 `BE:1C:81:BE:…:FF:54:9E:FD`, full value in `android/keystore/RELEASE_KEY_FINGERPRINT.txt`).
            Coming from 0.2.0 or older? Uninstall the old app once first: earlier builds used a different key.
            From 0.5.0 on, the app offers new versions itself (Profile → Settings → Version also checks).
