org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# The FoodFeed server the app connects to out of the box. When set, the app never asks for an
# address. Change it if the server moves (or override with -PserverUrl / FOODFEED_SERVER_URL).
serverUrl=https://foodfeed-aniket.eastus.cloudapp.azure.com
# In-app updates check this release feed.
updatesUrl=https://api.github.com/repos/aniketpitre/Food-MVP/releases/latest
