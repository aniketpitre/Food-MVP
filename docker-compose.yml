# FoodFeed self-hosted stack.
#   cp .env.example .env   # then fill in the secrets
#   docker compose up -d --build
# Optional extras:
#   docker compose --profile backup up -d   # nightly database + photo backups into ./backups
#   docker compose --profile https up -d    # automatic HTTPS with Caddy (needs DOMAIN and ports 80/443)
name: foodfeed

services:
  db:
    image: postgis/postgis:16-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: foodfeed
      POSTGRES_USER: foodfeed
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodfeed -d foodfeed"]
      interval: 5s
      timeout: 5s
      retries: 20
    # The database is deliberately not published to the host; only the api reaches it.

  api:
    build: ./backend
    image: ${API_IMAGE:-foodfeed-api:local}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://foodfeed:${POSTGRES_PASSWORD}@db:5432/foodfeed
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      SEED_ON_START: ${SEED_ON_START:-true}
      DEMO_ACTIVITY: ${DEMO_ACTIVITY:-false}
      RANK_REFRESH_SECONDS: ${RANK_REFRESH_SECONDS:-300}
      APP_DOWNLOAD_URL: ${APP_DOWNLOAD_URL:-https://github.com/aniketpitre/Food-MVP/releases/latest}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-contact@example.com}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - media:/data/media
    ports:
      - "${API_PORT:-8080}:8080"

  backup:
    image: postgis/postgis:16-3.5
    profiles: ["backup"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - media:/media:ro
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          stamp=$$(date +%F-%H%M)
          pg_dump -h db -U foodfeed -Fc foodfeed > /backups/db-$$stamp.dump &&
          tar czf /backups/media-$$stamp.tgz -C /media . &&
          echo "backup $$stamp done"
          find /backups -name 'db-*.dump' -mtime +$$KEEP_DAYS -delete
          find /backups -name 'media-*.tgz' -mtime +$$KEEP_DAYS -delete
          sleep 86400
        done

  caddy:
    image: caddy:2
    profiles: ["https"]
    restart: unless-stopped
    depends_on: [api]
    command: caddy reverse-proxy --from ${DOMAIN:-localhost} --to api:8080
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data

volumes:
  pgdata:
  media:
  caddy_data:
